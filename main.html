<html>
<head>
<meta charset="UTF-8">
<script src="http://code.jquery.com/jquery-1.11.3.min.js"></script>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap-theme.min.css">
<link rel="stylesheet" href="styles/main.css">

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script src="lib/constants.js"></script>
<script src="lib/math_helpers.js"></script>
<script src="lib/simple_csv_parser.js"></script>

<script src="lib/parse_stocks.js"></script>
<script src="lib/parse_trades.js"></script>
<script src="lib/parse_dividends.js"></script>

<script src="lib/show_filters.js"></script>
<script src="lib/filter_stocks.js"></script>
<script src="lib/compute_invested_amounts_dividents.js"></script>
<script src="lib/compute_next_trades.js"></script>
<script src="lib/compute_summaries.js"></script>
<script src="lib/compute_breakdowns.js"></script>
<script src="lib/show_invs_divs_per_period.js"></script>
<script src="lib/compute_yearly_stats.js"></script>
<script src="lib/show_stock_chart.js"></script>
<script src="lib/show_portfolio_charts.js"></script>
<script src="lib/show_stock_summaries.js"></script>
<script src="lib/show_stock_breakdowns.js"></script>
<script src="lib/show_next_trades.js"></script>
<script src="main.js"></script>

</head>

<body>

  <div class="container-fluid">
    <div class="row filters">
    </div>

    <div class="row">
      <div id="currency-info" style="font-size:0.8em; color:#666; padding:4px 0 4px 4px; border-bottom:1px solid #ddd;"></div>
    </div>

    <div class="row">
      <h3>Portfolio Charts</h3>
      <button id="portfolio-charts-toggle" class="btn btn-default btn-sm">Show Portfolio Charts</button>
      <div id="portfolio-charts-section" style="display:none; margin-top:12px;">
        <label style="font-weight:normal; margin-bottom:8px; display:block;">
          <input type="checkbox" id="bubble-active-only"> Active positions only
        </label>
        <canvas id="bubble-chart-canvas" height="80"></canvas>
        <h4 style="margin-top:24px;">Per-year: invested, P/L &amp; dividends</h4>
        <canvas id="yearly-chart-canvas" height="60"></canvas>
      </div>
    </div>

    <div class="row">
      <h3>Stocks summary</h3>
      <span class="stock-counts"></span>
      <table class="stock-summaries table table-striped table-bordered table-hover table-condensed">
      </table>
    </div>

    <div class="row">
        <table class="stock-breakdowns-all table table-striped table-bordered table-hover table-condensed">
        </table>
    </div>

    <div class="row">
      <div class="col-md-4">
        <h3>Geo breakdown</h3>
        <table class="stock-breakdowns-geo table table-striped table-bordered table-hover table-condensed">
        </table>
      </div>

      <div class="col-md-4">
        <h3>Class breakdown</h3>
        <table class="stock-breakdowns-class table table-striped table-bordered table-hover table-condensed">
        </table>
      </div>

      <div class="col-md-4">
        <h3>Combined breakdown</h3>
        <table class="stock-breakdowns-combo table table-striped table-bordered table-hover table-condensed">
        </table>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <h3>Next trades</h3>
        <table class="next-trades table table-striped table-bordered table-hover table-condensed">
        </table>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <h3>Investments & dividends per quarter/year</h3>
        <table class="invs-divs-per-period table table-striped table-bordered table-hover table-condensed">
        </table>
      </div>
    </div>
  </div>

</body>
</html>
